version: 1
backend:
  phases:
    build:
      commands:
        - echo "No backend build required for Python app"
frontend:
  phases:
    preBuild:
      commands:
        - echo "Installing Python dependencies..."
        - python3 -m pip install --upgrade pip
        - pip3 install -r requirements.txt
    build:
      commands:
        - echo "Python application - no build step required"
        - echo "Application will be served directly with uvicorn"
  artifacts:
    baseDirectory: .
    files:
      - '**/*'
  cache:
    paths:
      - /usr/local/lib/python3.9/site-packages/**
      - /root/.cache/pip/**
