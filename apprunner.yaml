version: 1.0
# App Runner configuration for FITS Python application
# Updated: 2025-01-09 15:30:00 - Fixed runtime version
runtime: python3
build:
  commands:
    build:
      - echo "Installing dependencies..."
      - pip install -r requirements.txt
run:
  runtime-version: 3.11
  command: python3 app.py
  network:
    port: 8000
    env: PORT