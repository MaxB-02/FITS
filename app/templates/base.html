<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FITS - Freak in the Sheets{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-zinc-950 text-zinc-100">
    <!-- Header -->
    <header class="border-b border-zinc-800">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <a href="/" class="text-2xl font-bold text-emerald-400">FITS</a>
                    <nav class="hidden md:flex space-x-6">
                        <a href="/portfolio" class="text-zinc-300 hover:text-white transition-colors">Portfolio</a>
                        <a href="/templates" class="text-zinc-300 hover:text-white transition-colors">Templates</a>
                        <a href="/inquire" class="text-zinc-300 hover:text-white transition-colors">Inquire</a>
                    </nav>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/admin" class="text-zinc-300 hover:text-white transition-colors">Admin</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-zinc-800 mt-16">
        <div class="container mx-auto px-4 py-8">
            <div class="text-center text-zinc-400">
                <p>&copy; 2024 Freak in the Sheets. Custom automation & dashboards tailored to your workflow.</p>
            </div>
        </div>
    </footer>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
